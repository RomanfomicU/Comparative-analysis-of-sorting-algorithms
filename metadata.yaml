---
title: "Сравнительный анализ алгоритмов сортировки: теоретические оценки и эксперимент"
author: "Роман Фомичев"
date: "2026"
lang: ru-RU
abstract: |
  В статье рассматриваются четыре классических алгоритма сортировки сравнениями:
  сортировка вставками, слиянием, быстрая и пирамидальная. Приводятся теоретические
  оценки их трудоёмкости и нижняя граница числа сравнений. Оценки проверяются
  экспериментально: для каждого алгоритма измерены время работы и число сравнений
  на случайных массивах размером от 250 до 4000 элементов.

